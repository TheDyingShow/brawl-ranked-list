<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars - Ranked Leaderboard</title>
    <!-- TailwindCSS for the clean Demonlist dark theme layout -->
    <script src="https://tailwindcss.com"></script>
    <!-- PapaParse library to smoothly parse your CSV data -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            background-color: #0b111e; /* Ultra-dark background inspired by Demonlist */
            color: #e2e8f0;
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen pb-12">

    <!-- NAVIGATION BAR -->
    <nav class="bg-[#0f172a] border-b border-gray-800 px-6 py-4 flex items-center justify-between shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center font-bold text-white shadow-md shadow-blue-500/20">🏆</div>
            <span class="font-black tracking-wider text-xl uppercase text-white">BRAWL RANKED LIST</span>
        </div>
        <div class="text-sm text-gray-400 font-medium">All-Time Pro Seasons</div>
    </nav>

    <!-- MAIN DASHBOARD AREA -->
    <main class="max-w-4xl mx-auto px-4 mt-8">
        
        <!-- DYNAMIC SEARCH BAR -->
        <div class="mb-6 relative">
            <input type="text" id="searchBar" onkeyup="filterPlayers()" placeholder="Search player name or tag..." 
                   class="w-full bg-[#131c2e] border border-gray-800 rounded-xl px-5 py-4 pl-12 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 shadow-inner transition-all">
            <span class="absolute left-4 top-4 text-gray-500">🔍</span>
        </div>

        <!-- LEADERBOARD DYNAMIC CARDS CONTAINER -->
        <div id="leaderboard" class="space-y-4">
            <!-- CSV lines inject here automatically as Demonlist style layout components -->
            <div class="text-center text-gray-500 py-12 animate-pulse">Loading competitive ranking database...</div>
        </div>
    </main>

    <!-- JAVASCRIPT LOGIC ENGINE -->
    <script>
        let allPlayers = [];

        // 1. Load and parse local leaderboard dataset file
        Papa.parse('leaderboard.csv', {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                allPlayers = results.data;
                displayLeaderboard(allPlayers);
            },
            error: function(err) {
                document.getElementById('leaderboard').innerHTML = 
                    `<div class="text-center text-red-500 bg-red-950/30 border border-red-900 rounded-xl p-6">
                        Error: Failed to fetch 'leaderboard.csv'. Please verify that the data file is placed in the exact same workspace directory.
                     </div>`;
            }
        });

        // 2. Build the structural dynamic UI horizontal card modules
        function displayLeaderboard(players) {
            const container = document.getElementById('leaderboard');
            container.innerHTML = '';

            if (players.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 py-8">No matching records found.</div>';
                return;
            }

            players.forEach((player, index) => {
                // Maps structural definitions smoothly against your French active Google Sheets columns
                const pseudo = player['Pseudo'] || 'Unknown Player';
                const tag = player['Tag Joueur'] || '';
                const points = player['Points Total'] || '0';
                const peakRank = player['Meilleur Rang'] || '-';

                const card = document.createElement('div');
                card.className = "card-item bg-[#131c2e] border border-gray-800/80 rounded-xl p-5 flex flex-col sm:flex-row items-center justify-between gap-5 hover:border-gray-700 hover:bg-[#162238] transition-all shadow-md group";
                
                card.innerHTML = `
                    <div class="flex items-center space-x-5 w-full sm:w-auto">
                        <!-- Simulated illustrated block asset matching Demonlist custom headers -->
                        <div class="w-24 h-16 bg-[#0b111e] rounded-lg border border-gray-800 flex items-center justify-center text-xs text-gray-600 font-bold tracking-tight relative overflow-hidden group-hover:border-gray-700 transition-colors shrink-0">
                            <span class="z-10 opacity-40 uppercase tracking-tighter">Ranked Pro</span>
                            <div class="absolute inset-0 bg-gradient-to-tr from-blue-600/5 to-transparent"></div>
                        </div>
                        
                        <!-- Player Metadata Block -->
                        <div>
                            <div class="flex items-baseline space-x-2">
                                <span class="text-sm font-bold text-blue-500">#${index + 1}</span>
                                <h2 class="text-lg font-black text-white tracking-wide group-hover:text-blue-400 transition-colors">${pseudo}</h2>
                            </div>
                            <p class="text-xs font-mono text-gray-500 mt-0.5">${tag}</p>
                        </div>
                    </div>

                    <!-- Strategic Metric Fields (Peak Standing and Cumulative Point Scores) -->
                    <div class="flex items-center space-x-8 text-right w-full sm:w-auto justify-between sm:justify-end border-t border-gray-800/50 sm:border-t-0 pt-3 sm:pt-0">
                        <div class="text-left sm:text-right">
                            <span class="block text-xs uppercase tracking-wider font-bold text-gray-400">Peak Rank</span>
                            <span class="text-sm font-black text-amber-500 font-mono">Top ${peakRank}</span>
                        </div>
                        <div>
                            <span class="block text-xs uppercase tracking-wider font-bold text-gray-400">Total Points</span>
                            <span class="text-xl font-black text-emerald-400 font-mono">${points} <span class="text-xs font-bold text-emerald-600">pts</span></span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 3. Real-time alphanumeric string pattern evaluation (Instant Search Filter)
        function filterPlayers() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            const matchingPlayers = allPlayers.filter(player => {
                const pseudo = (player['Pseudo'] || '').toLowerCase();
                const tag = (player['Tag Joueur'] || '').toLowerCase();
                return pseudo.includes(query) || tag.includes(query);
            });
            displayLeaderboard(matchingPlayers);
        }
    </script>
</body>
</html>
