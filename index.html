<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Ranked Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a0e14;
            --bg-secondary: #0f141f;
            --border-color: #1e293b;
            --text-muted: #64748b;
            --text-primary: #e2e8f0;
            --accent-gold: #fbbf24;
            --accent-emerald: #34d399;
        }
        
        body { 
            background-color: var(--bg-primary); 
            color: var(--text-primary);
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        /* Compact row styling like DemonList */
        .player-row {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            transition: all 0.15s ease;
        }
        
        .player-row:hover {
            background-color: #131a26;
            border-color: #475569;
        }
        
        .rank-badge {
            font-family: monospace;
            font-weight: 700;
            font-size: 0.875rem;
            min-width: 2.5rem;
            text-align: center;
        }
        
        .rank-1 { color: var(--accent-gold); text-shadow: 0 0 10px rgba(251, 191, 36, 0.4); }
        .rank-2 { color: #94a3b8; }
        .rank-3 { color: #cd7f32; }
        
        .flag-icon {
            width: 28px;
            height: 20px;
            border-radius: 3px;
            object-fit: cover;
        }
        
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.85);
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col md:flex-row">

    <!-- SIDEBAR -->
    <aside class="w-full md:w-64 bg-[#090f1c] border-b md:border-b-0 md:border-r border-slate-900 p-5 flex flex-col shrink-0">
        <div class="flex items-center space-x-3 mb-8">
            <div class="w-8 h-8 bg-gradient-to-tr from-amber-500 to-yellow-400 rounded-lg flex items-center justify-center font-black text-black text-sm shadow-lg">⚡</div>
            <div>
                <h1 class="font-black tracking-wider text-sm uppercase text-white leading-none">BRAWL LIST</h1>
                <span class="text-[9px] tracking-widest uppercase font-bold text-slate-500">Ranked</span>
            </div>
        </div>

        <div class="bg-[#0f172a] border border-slate-900 rounded-lg p-3 mb-6">
            <span class="block text-[8px] uppercase tracking-widest font-black text-slate-500 mb-2">Parameters</span>
            <span class="text-[10px] font-bold text-blue-400 uppercase tracking-wide">Min Pro Rank (11,250+)</span>
            <div class="mt-2 pt-2 border-t border-slate-800/60 flex justify-between text-[10px]">
                <span class="text-slate-500">Timeline:</span>
                <span class="font-bold text-white font-mono">Mar 25 - Aug 26</span>
            </div>
        </div>

        <div class="relative mb-6">
            <input type="text" id="searchBar" onkeyup="searchTrigger()" placeholder="Search player/tag..." 
                   class="w-full bg-[#0f172a] border border-slate-950 text-xs rounded-lg px-3 py-2.5 pl-9 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
            <span class="absolute left-3 top-2.5 text-[10px] opacity-40">🔍</span>
        </div>

        <div class="mt-auto pt-4 border-t border-slate-900 text-[9px] text-slate-600 font-mono tracking-tight text-center md:text-left">
            © 2026 @TheKitboxerShow
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-5 md:p-8 max-w-5xl">
        <div class="mb-5 flex items-center justify-between">
            <h2 class="text-[10px] uppercase tracking-widest font-black text-slate-400">Database Matrix</h2>
            <span id="playerCount" class="text-[10px] font-mono font-bold bg-[#090f1c] border border-slate-900 text-slate-400 px-2 py-1 rounded">0 Records</span>
        </div>

        <div class="overflow-hidden bg-[#0f141f] border border-slate-900 rounded-xl">
            <!-- Table Header -->
            <div class="grid grid-cols-12 gap-2 px-4 py-3 bg-[#090f1c] border-b border-slate-900 text-[9px] uppercase tracking-wider font-bold text-slate-500">
                <div class="col-span-1">#</div>
                <div class="col-span-2">Country</div>
                <div class="col-span-5">Player</div>
                <div class="col-span-2 text-center">Peak</div>
                <div class="col-span-2 text-right">Points</div>
            </div>

            <!-- Player Rows Container -->
            <div id="leaderboard" class="divide-y divide-slate-900/50"></div>
        </div>

        <!-- Pagination -->
        <div class="mt-6 pt-5 border-t border-slate-900/60 flex items-center justify-between text-xs font-mono">
            <button id="btnPrev" onclick="changePage(-1)" class="bg-[#090f1c] border border-slate-800 hover:border-slate-700 text-white px-3 py-2 rounded-lg disabled:opacity-30 disabled:cursor-not-allowed transition-all">
                ← Prev
            </button>
            <span id="pageIndicator" class="text-slate-500 font-bold">Page 1/1</span>
            <button id="btnNext" onclick="changePage(1)" class="bg-[#090f1c] border border-slate-800 hover:border-slate-700 text-white px-3 py-2 rounded-lg disabled:opacity-30 disabled:cursor-not-allowed transition-all">
                Next →
            </button>
        </div>
    </main>

    <!-- PLAYER PROFILE MODAL -->
    <div id="playerModal" class="fixed inset-0 modal-overlay z-50 hidden items-center justify-center">
        <div class="bg-[#0f141f] border border-slate-700 rounded-xl shadow-2xl max-w-lg w-full mx-4 max-h-[80vh] overflow-y-auto">
            <div class="sticky top-0 bg-[#090f1c] border-b border-slate-800 px-6 py-4 flex items-center justify-between">
                <h3 class="font-bold text-white text-lg">Player Profile</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition-colors">✕</button>
            </div>
            <div class="p-6 space-y-4">
                <div class="flex items-center space-x-4">
                    <img id="modalFlag" class="flag-icon shadow-md" alt="Flag">
                    <div>
                        <h2 id="modalName" class="text-xl font-bold text-white"></h2>
                        <p id="modalTag" class="text-xs font-mono text-slate-500 mt-1"></p>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-4 mt-4">
                    <div class="bg-[#090f1c] border border-slate-800 rounded-lg p-4 text-center">
                        <span class="block text-[9px] uppercase tracking-widest font-bold text-slate-500">Total Points</span>
                        <span id="modalPoints" class="text-2xl font-black text-emerald-400 font-mono mt-1">0</span>
                    </div>
                    <div class="bg-[#090f1c] border border-slate-800 rounded-lg p-4 text-center">
                        <span class="block text-[9px] uppercase tracking-widest font-bold text-slate-500">Peak Rank</span>
                        <span id="modalPeak" class="text-2xl font-black text-amber-500 font-mono mt-1">-</span>
                    </div>
                </div>

                <div class="space-y-2 mt-4">
                    <button id="modalLink" target="_blank" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center space-x-2">
                        <i class="fas fa-external-link-alt"></i>
                        <span>View BrawlAce Profile</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allPlayers = [];
        let filteredPlayers = [];
        let countryMap = {};         // tag -> ISO code (optional lookup)
        let currentPage = 1;
        const recordsPerPage = 50;

        const FLAG_CDN = 'https://flagcdn.com/w40/';

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function profileUrl(tag) {
            return 'https://brawlace.com/players/%23' + encodeURIComponent(tag.replace(/^#/, ''));
        }

        function getFlagUrl(countryCode) {
            if (!countryCode || countryCode === 'XX') return '';
            return FLAG_CDN + countryCode.toLowerCase() + '.png';
        }

        // Optional countries.csv: tag,CC (e.g. #2R0JLJJ9PP,FR)
        Papa.parse('countries.csv', {
            download: true,
            header: false,
            skipEmptyLines: true,
            complete: function(results) {
                var rows = results.data || [];
                for (var i = 0; i < rows.length; i++) {
                    var r = rows[i];
                    if (r && r.length >= 2 && r[0] && r[0].indexOf('#') !== -1 && /^[A-Z]{2}$/.test(r[1])) {
                        countryMap[r[0].trim()] = r[1].trim();
                    }
                }
                updatePageData();
            },
            error: function() {
                // Silent fallback - no country data loaded
            }
        });

        Papa.parse('leaderboard.csv', {
            download: true,
            header: false,
            skipEmptyLines: true,
            complete: function(results) {
                var rawRows = results.data;
                for (var i = 0; i < rawRows.length; i++) {
                    var row = rawRows[i];
                    if (row && row.length >= 4) {
                        var tag = row[0] ? row[0].trim() : '';
                        if (tag.indexOf('#') === -1) continue;
                        allPlayers.push({
                            tag: tag,
                            pseudo: row[1] ? row[1].trim() : 'Unknown',
                            points: parseInt(row[2], 10) || 0,
                            peakRank: parseInt(row[3], 10) || 999,
                            country: countryMap[tag] || 'XX'
                        });
                    }
                }
                allPlayers.sort(function(a, b) {
                    if (b.points !== a.points) return b.points - a.points;
                    return a.peakRank - b.peakRank;
                });
                filteredPlayers = allPlayers.slice(0);
                document.getElementById('playerCount').innerText = allPlayers.length + ' Records Loaded';
                updatePageData();
            },
            error: function() {
                document.getElementById('leaderboard').innerHTML = 
                    '<div class="p-6 text-center text-xs font-mono uppercase text-red-400">Leaderboard data unavailable</div>';
            }
        });

        function displayPage(pageData, startIndex) {
            var container = document.getElementById('leaderboard');
            container.innerHTML = '';

            if (pageData.length === 0) {
                container.innerHTML = '<div class="px-4 py-8 text-center text-xs font-mono uppercase text-slate-600">No records found</div>';
                return;
            }

            pageData.forEach(function(player, index) {
                var globalIndex = startIndex + index;
                var rankClass = globalIndex === 0 ? 'rank-1' : (globalIndex === 1 ? 'rank-2' : (globalIndex === 2 ? 'rank-3' : ''));
                var peakLabel = player.peakRank >= 999 ? '-' : 'Top ' + player.peakRank;
                
                var row = document.createElement('div');
                row.className = 'player-row grid grid-cols-12 gap-2 px-4 py-3 items-center cursor-pointer';
                row.onclick = function(e) {
                    e.preventDefault();
                    openModal(player);
                };

                var flagUrl = getFlagUrl(player.country);
                var flagHtml = flagUrl 
                    ? '<img src="' + flagUrl + '" class="flag-icon" alt="' + player.country + '">'
                    : '<span class="flag-icon bg-[#1e293b] flex items-center justify-center text-[9px] text-slate-600">?</span>';

                row.innerHTML =
                    '<div class="rank-badge ' + rankClass + '">' + (globalIndex + 1) + '</div>' +
                    '<div class="flex items-center">' + flagHtml + '</div>' +
                    '<div class="truncate">' +
                        '<span class="font-bold text-white truncate">' + escapeHtml(player.pseudo) + '</span>' +
                        '<span class="ml-2 text-[10px] text-slate-500 font-mono">' + escapeHtml(player.tag) + '</span>' +
                    '</div>' +
                    '<div class="text-center text-xs font-bold text-amber-500/90 font-mono">' + peakLabel + '</div>' +
                    '<div class="text-right">' +
                        '<span class="font-black text-emerald-400 font-mono">' + player.points + '</span>' +
                        '<span class="text-[8px] text-slate-500 ml-1">PTS</span>' +
                    '</div>';

                container.appendChild(row);
            });
        }

        function openModal(player) {
            document.getElementById('modalFlag').src = getFlagUrl(player.country) || '';
            document.getElementById('modalName').textContent = player.pseudo;
            document.getElementById('modalTag').textContent = player.tag;
            document.getElementById('modalPoints').textContent = player.points;
            document.getElementById('modalPeak').textContent = player.peakRank >= 999 ? 'N/A' : 'Top ' + player.peakRank;
            
            var linkBtn = document.getElementById('modalLink');
            linkBtn.href = profileUrl(player.tag);
            
            document.getElementById('playerModal').classList.remove('hidden');
            document.getElementById('playerModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('playerModal').classList.add('hidden');
            document.getElementById('playerModal').classList.remove('flex');
        }

        function updatePageData() {
            var totalPages = Math.ceil(filteredPlayers.length / recordsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            displayPage(filteredPlayers.slice((currentPage - 1) * recordsPerPage, currentPage * recordsPerPage), (currentPage - 1) * recordsPerPage);

            document.getElementById('pageIndicator').innerText = 'Page ' + currentPage + '/' + totalPages;
            document.getElementById('btnPrev').disabled = (currentPage === 1);
            document.getElementById('btnNext').disabled = (currentPage === totalPages);
        }

        function changePage(direction) {
            currentPage += direction;
            updatePageData();
        }

        function searchTrigger() {
            var query = document.getElementById('searchBar').value.trim().toLowerCase();
            if (!query) {
                filteredPlayers = allPlayers.slice(0);
            } else {
                filteredPlayers = allPlayers.filter(function(p) {
                    return p.pseudo.toLowerCase().indexOf(query) !== -1 || p.tag.toLowerCase().indexOf(query) !== -1;
                });
            }
            currentPage = 1;
            updatePageData();
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // Close modal on overlay click
        document.getElementById('playerModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
