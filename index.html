<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Ranked Leaderboard</title>
    <!-- TailwindCSS framework for styling -->
    <script src="https://tailwindcss.com"></script>
    <!-- PapaParse to read the CSV dataset -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            background-color: #080c14; /* Core Demonlist background color */
            color: #afb3b9;
        }
        /* Custom scrollbar matching the dark theme layout */
        ::-webkit-scrollbar { wht: 8px; width: 8px; }
        ::-webkit-scrollbar-track { background: #080c14; }
        ::-webkit-scrollbar-thumb { background: #1b273d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #253754; }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col md:flex-row">

    <!-- LEFT SIDEBAR PANEL (Exact Demonlist Navigation Geometry) -->
    <aside class="w-full md:w-80 bg-[#0c1220] border-b md:border-b-0 md:border-r border-gray-900/60 p-6 flex flex-col justify-between shrink-0">
        <div>
            <!-- Header Brand -->
            <div class="flex items-center space-x-3 mb-8">
                <div class="w-9 h-9 bg-gradient-to-tr from-amber-500 to-yellow-400 rounded-xl flex items-center justify-center font-black text-black shadow-lg shadow-amber-500/10">⚡</div>
                <div>
                    <h1 class="font-black tracking-wider text-md uppercase text-white leading-none">BRAWL LIST</h1>
                    <span class="text-[10px] tracking-widest uppercase font-bold text-gray-500">Ranked Leaderboard</span>
                </div>
            </div>

            <!-- Stats Overview Card -->
            <div class="bg-[#11192b] border border-gray-900/50 rounded-xl p-4 mb-6">
                <span class="block text-[10px] uppercase tracking-wider font-bold text-gray-500">System Mode</span>
                <span class="text-sm font-black text-blue-400 uppercase tracking-wide">Pro Tier Elo (11,250+)</span>
                <div class="mt-3 pt-3 border-t border-gray-800/40 flex justify-between text-xs">
                    <span class="text-gray-400">Tracked Seasons:</span>
                    <span class="font-bold text-white font-mono">Mar 2025 - Jul 2026</span>
                </div>
            </div>

            <!-- Real-time Alphanumeric Search Engine -->
            <div class="relative">
                <input type="text" id="searchBar" onkeyup="filterPlayers()" placeholder="Search player or tag..." 
                       class="w-full bg-[#11192b] border border-gray-900 text-sm rounded-xl px-4 py-3 pl-10 text-white placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                <span class="absolute left-3.5 top-3.5 text-xs opacity-40">🔍</span>
            </div>
        </div>

        <!-- Footer Module -->
        <div class="mt-8 pt-4 border-t border-gray-900/40 text-[10px] text-gray-600 font-mono tracking-tight text-center md:text-left">
            Inspired by Geometry Dash Demonlist<br>© 2026 Competitive Analytics Engine
        </div>
    </aside>

    <!-- RIGHT CONTAINER MODULE (Leaderboard Content Feed) -->
    <main class="flex-1 p-6 md:p-10 max-w-4xl overflow-y-auto h-screen">
        <div class="mb-6 flex items-center justify-between">
            <h2 class="text-xs uppercase tracking-widest font-black text-gray-400">Active Structural Standings</h2>
            <span id="playerCount" class="text-xs font-mono font-bold bg-[#11192b] border border-gray-900 text-gray-400 px-3 py-1 rounded-md">0 Players Registered</span>
        </div>

        <!-- Dynamic List Container -->
        <div id="leaderboard" class="space-y-2.5">
            <div class="text-center text-sm text-gray-600 py-12 animate-pulse font-mono uppercase tracking-wider">Syncing tracking database grid...</div>
        </div>
    </main>

    <!-- PROCESSING LOGIC ENGINE -->
    <script>
        let allPlayers = [];

        Papa.parse('leaderboard.csv', {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                allPlayers = results.data;
                document.getElementById('playerCount').innerText = `${allPlayers.length} Players Registered`;
                displayLeaderboard(allPlayers);
            },
            error: function() {
                document.getElementById('leaderboard').innerHTML = 
                    `<div class="text-center text-xs font-mono uppercase tracking-wider text-red-400 bg-red-950/20 border border-red-900/40 rounded-xl p-6">
                        Data Stream Error: Failed to target 'leaderboard.csv'. Check root folder paths.
                     </div>`;
            }
        });

        function displayLeaderboard(players) {
            const container = document.getElementById('leaderboard');
            container.innerHTML = '';

            if (players.length === 0) {
                container.innerHTML = '<div class="text-center text-xs font-mono uppercase tracking-wider text-gray-600 py-8">No matrix records matched query</div>';
                return;
            }

            players.forEach((player, index) => {
                const pseudo = player['Pseudo'] || 'Unknown Operator';
                const tag = player['Tag Joueur'] || '#000000';
                const points = player['Points Total'] || '0';
                const peakRank = player['Meilleur Rang'] || '-';

                // Assigning podium aesthetics matching standard tier list badges
                let rankBadgeColor = "text-blue-500 bg-blue-950/20 border-blue-900/30";
                let nameColor = "text-white";
                
                if (index === 0) {
                    rankBadgeColor = "text-yellow-400 bg-yellow-950/30 border-yellow-700/40 font-black";
                    nameColor = "text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-amber-400 to-yellow-200 font-extrabold";
                } else if (index === 1) {
                    rankBadgeColor = "text-slate-300 bg-slate-900/40 border-slate-700/40";
                    nameColor = "text-transparent bg-clip-text bg-gradient-to-r from-slate-100 to-slate-300 font-bold";
                } else if (index === 2) {
                    rankBadgeColor = "text-amber-600 bg-amber-950/20 border-amber-900/30";
                    nameColor = "text-transparent bg-clip-text bg-gradient-to-r from-amber-200 to-amber-500 font-bold";
                }

                const card = document.createElement('div');
                card.className = "bg-[#0c1220] border border-gray-900/60 rounded-xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4 hover:border-gray-800/80 hover:bg-[#101729] transition-all duration-150 group";
                
                card.innerHTML = `
                    <div class="flex items-center space-x-4 w-full sm:w-auto">
                        <!-- Numerical Badge -->
                        <div class="w-10 h-10 rounded-lg border flex items-center justify-center text-xs font-mono ${rankBadgeColor} shrink-0 shadow-inner">
                            ${index + 1}
                        </div>
                        
                        <!-- Profile Metadata -->
                        <div>
                            <h2 class="text-sm font-bold tracking-wide transition-colors ${nameColor} group-hover:text-blue-400">${pseudo}</h2>
                            <p class="text-[10px] font-mono text-gray-600 tracking-tight mt-0.5">${tag}</p>
                        </div>
                    </div>

                    <!-- Metric Blocks -->
                    <div class="flex items-center space-x-8 text-right w-full sm:w-auto justify-between sm:justify-end border-t border-gray-950 pt-3 sm:pt-0 sm:border-t-0">
                        <div class="text-left sm:text-right">
                            <span class="block text-[9px] uppercase tracking-widest font-bold text-gray-600">Peak Standing</span>
                            <span class="text-xs font-bold text-amber-500/90 font-mono">Top ${peakRank}</span>
                        </div>
                        <div>
                            <span class="block text-[9px] uppercase tracking-widest font-bold text-gray-600">Score Weight</span>
                            <span class="text-sm font-black text-emerald-400 font-mono tracking-tight">${points} <span class="text-[10px] font-bold text-emerald-600">PTS</span></span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterPlayers() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            const matchingPlayers = allPlayers.filter(player => {
                const pseudo = (player['Pseudo'] || '').toLowerCase();
                const tag = (player['Tag Joueur'] || '').toLowerCase();
                return pseudo.includes(query) || tag.includes(query);
            });
            displayLeaderboard(matchingPlayers);
        }
    </script>
</body>
</html>
