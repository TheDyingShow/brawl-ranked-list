<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Ranked Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { background-color: #0a0e14; color: #e2e8f0; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0e14; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .player-row { background-color: #0f141f; border-bottom: 1px solid #1e293b; transition: all 0.15s ease; }
        .player-row:hover { background-color: #131a26; border-color: #475569; }
        .rank-badge { font-family: monospace; font-weight: 700; font-size: 0.875rem; text-align: center; }
        .rank-1 { color: #fbbf24; text-shadow: 0 0 10px rgba(251,191,36,0.4); }
        .rank-2 { color: #94a3b8; }
        .rank-3 { color: #cd7f32; }
        .flag-icon { width: 32px; height: 22px; border-radius: 4px; object-fit: cover; }
        .filter-select {
            background-color: #0f172a; border: 1px solid #020617; color: #e2e8f0;
            font-size: 0.7rem; border-radius: 0.5rem; padding: 0.5rem 0.6rem; width: 100%;
        }
        .filter-select:focus { outline: none; border-color: #3b82f6; }
        #playerDrawer { transition: transform 0.3s ease; transform: translateX(100%); }
        #playerDrawer.open { transform: translateX(0); }
        .stat-line { display: flex; justify-content: space-between; align-items: baseline; }
        .elo-plus { color: #34d399; }
        .elo-minus { color: #f87171; }
        .row-offline .player-row-sub { opacity: 0.45; }
        @media (min-width: 768px) {
            .content-area { margin-right: 0; transition: margin-right 0.3s ease; }
            body.drawer-open .content-area { margin-right: 24rem; }
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen">

<div id="appWrapper" class="flex flex-col md:flex-row min-h-screen">
    <aside class="sidebar w-full md:w-64 bg-[#090f1c] border-b md:border-b-0 md:border-r border-slate-900 p-5 flex flex-col shrink-0">
        <div class="flex items-center space-x-3 mb-6">
            <div class="w-8 h-8 bg-gradient-to-tr from-amber-500 to-yellow-400 rounded-lg flex items-center justify-center font-black text-black text-sm shadow-lg">⚡</div>
            <div>
                <h1 class="font-black tracking-wider text-sm uppercase text-white leading-none">BRAWL LIST</h1>
                <span class="text-[9px] tracking-widest uppercase font-bold text-slate-500">Ranked</span>
            </div>
        </div>

        <div class="bg-[#0f172a] border border-slate-900 rounded-lg p-3 mb-5">
            <span class="block text-[8px] uppercase tracking-widest font-black text-slate-500 mb-2">Parameters</span>
            <span class="text-[10px] font-bold text-blue-400 uppercase tracking-wide">Min Pro Rank (11,250+)</span>
            <div class="mt-2 pt-2 border-t border-slate-800/60 flex justify-between text-[10px]">
                <span class="text-slate-500">Timeline:</span>
                <span class="font-bold text-white font-mono">Mar 25 - Aug 26</span>
            </div>
        </div>

        <div class="relative mb-3">
            <input type="text" id="searchBar" onkeyup="applyFilters()" placeholder="Search player/tag..."
                   class="w-full bg-[#0f172a] border border-slate-950 text-xs rounded-lg px-3 py-2.5 pl-9 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 transition-all">
            <span class="absolute left-3 top-2.5 text-[10px] opacity-40">🔍</span>
        </div>

        <div class="space-y-2 mb-3">
            <select id="filterCountry" class="filter-select" onchange="applyFilters()">
                <option value="">All countries</option>
            </select>
            <select id="filterMonth" class="filter-select" onchange="applyFilters()">
                <option value="-1">All-time</option>
            </select>
            <select id="filterSort" class="filter-select" onchange="applyFilters()">
                <option value="points">Sort: Points</option>
                <option value="elo">Sort: Elo</option>
                <option value="peak">Sort: Best placement</option>
                <option value="activity">Sort: Activity</option>
            </select>
        </div>

        <div class="mt-auto pt-4 border-t border-slate-900 text-[9px] text-slate-600 font-mono text-center md:text-left">
            © 2026 @TheKitboxerShow
        </div>
    </aside>

    <main class="content-area flex-1 p-5 md:p-8 max-w-5xl flex flex-col justify-between min-h-screen">
        <div>
            <div class="mb-5 flex items-center justify-between">
                <h2 id="viewTitle" class="text-[10px] uppercase tracking-widest font-black text-slate-400">Standings — All-time</h2>
                <span id="playerCount" class="text-[10px] font-mono font-bold bg-[#090f1c] border border-slate-900 text-slate-400 px-2 py-1 rounded">0 Records</span>
            </div>

            <div id="seasonStatus" class="hidden mb-4 text-[10px] font-mono text-amber-500 bg-amber-950/20 border border-amber-800/30 rounded-lg px-3 py-2"></div>

            <div class="overflow-hidden bg-[#0f141f] border border-slate-900 rounded-xl">
                <div class="grid grid-cols-12 gap-3 px-4 py-3 bg-[#090f1c] border-b border-slate-900 text-[9px] uppercase tracking-wider font-bold text-slate-500">
                    <div class="col-span-1 text-center">#</div>
                    <div class="col-span-1">Country</div>
                    <div class="col-span-4">Player</div>
                    <div class="col-span-2 text-right">Peak</div>
                    <div class="col-span-4 text-right" id="statHeader">Points</div>
                </div>
                <div id="leaderboard" class="divide-y divide-slate-900/50"></div>
            </div>
        </div>

        <div class="mt-6 pt-5 border-t border-slate-900/60 flex items-center justify-between text-xs font-mono pb-6">
            <button id="btnPrev" onclick="changePage(-1)" class="bg-[#090f1c] border border-slate-800 hover:border-slate-700 text-white px-3 py-2 rounded-lg disabled:opacity-30 disabled:cursor-not-allowed transition-all">← Prev</button>
            <span id="pageIndicator" class="text-slate-500 font-bold">Page 1/1</span>
            <button id="btnNext" onclick="changePage(1)" class="bg-[#090f1c] border border-slate-800 hover:border-slate-700 text-white px-3 py-2 rounded-lg disabled:opacity-30 disabled:cursor-not-allowed transition-all">Next →</button>
        </div>
    </main>
</div>

<!-- SIDE DRAWER -->

    <div class="sticky top-0 bg-[#090f1c] border-b border-slate-800 px-5 py-4 flex items-center justify-between">
        <h3 class="font-bold text-white text-sm">Player Profile</h3>
        <button onclick="closeDrawer()" class="text-slate-400 hover:text-white transition-colors text-lg leading-none">✕</button>
    </div>
    <div class="p-5 space-y-4">
        <!-- Identité centrée (style DemonList) -->
        <div class="flex flex-col items-center text-center space-y-2">
            <img id="dFlag" class="flag-icon shadow-md" alt="">
            <div class="min-w-0 w-full">
                <h2 id="dName" class="text-lg font-bold text-white truncate"></h2>
                <p id="dTag" class="text-xs font-mono text-slate-500 mt-0.5"></p>
            </div>
            <p id="dCountry" class="text-xs text-slate-400"></p>
            <span id="dStatus" class="hidden text-[9px] uppercase tracking-widest font-black px-2 py-0.5 rounded"></span>
        </div>
        <div class="space-y-2">
            <div class="stat-line bg-[#090f1c] border border-slate-800 rounded-lg px-4 py-3">
                <span class="text-[10px] uppercase tracking-widest font-bold text-slate-500">Points</span>
                <span id="dPoints" class="text-lg font-black text-emerald-400 font-mono">0</span>
            </div>
            <div class="stat-line bg-[#090f1c] border border-slate-800 rounded-lg px-4 py-3">
                <span class="text-[10px] uppercase tracking-widest font-bold text-slate-500">Elo</span>
                <span id="dElo" class="text-lg font-black text-blue-400 font-mono">-</span>
            </div>
            <div class="stat-line bg-[#090f1c] border border-slate-800 rounded-lg px-4 py-3">
                <span class="text-[10px] uppercase tracking-widest font-bold text-slate-500">Peak</span>
                <span id="dPeak" class="text-lg font-black text-amber-500 font-mono">-</span>
            </div>
        </div>
        <!-- Boutons profils, juste sous le Peak -->
        <div class="space-y-2">
            <a id="dLink" target="_blank" rel="noopener noreferrer"
               class="block text-center bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors text-sm">
                View BrawlAce Profile ↗</a>
            <a id="dLinkBI" target="_blank" rel="noopener noreferrer"
               class="block text-center bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg transition-colors text-sm">
                View Brawl Insights Profile ↗</a>
        </div>
        <div>
            <span class="block text-[9px] uppercase tracking-widest font-bold text-slate-500 mb-2">Season history</span>
            <div id="dHistory" class="space-y-1 text-xs font-mono"></div>
        </div>
    </div>
</div>

<script>
// ======================= ELO CONFIG (v4) =======================
var START_RATING = 1500;
var ELO_CEILING = 3000;
var MAX_GAIN = 500;
var PLACE_EXP = 4;
var FIELD_MIN = 20;
var FIELD_EXP = 0.42;
var FLOOR_MOMENTUM = 0.2;
var LOSS_BASE = 25;
var LOSS_SCALE = 0.25;
var SHIELD_WINDOW = 12;
var OFFLINE_MONTHS = 12;   // > 12 mois sans pro = "offline"

var SEASONS = [
    { key: 'mars25',      label: 'March 2025' }, { key: 'avril25',     label: 'April 2025' },
    { key: 'mai25',       label: 'May 2025' },   { key: 'juin25',      label: 'June 2025' },
    { key: 'juillet25',   label: 'July 2025' },  { key: 'aout25',      label: 'August 2025' },
    { key: 'septembre25', label: 'September 2025' }, { key: 'octobre25',  label: 'October 2025' },
    { key: 'novembre25',  label: 'November 2025' }, { key: 'decembre25', label: 'December 2025' },
    { key: 'janvier26',   label: 'January 2026' }, { key: 'fevrier26',   label: 'February 2026' },
    { key: 'mars26',      label: 'March 2026' }, { key: 'avril26',     label: 'April 2026' },
    { key: 'mai26',       label: 'May 2026' },   { key: 'juin26',      label: 'June 2026' },
    { key: 'juillet26',   label: 'July 2026' },  { key: 'aout26',      label: 'August 2026' }
];
var LAST_SEASON_IDX = SEASONS.length - 1;

var COUNTRY_NAMES = {
    'AR':'Argentina','AU':'Australia','AT':'Austria','BE':'Belgium','BO':'Bolivia',
    'BA':'Bosnia and Herz.','BR':'Brazil','BG':'Bulgaria','CA':'Canada','CL':'Chile',
    'CN':'China','CO':'Colombia','CR':'Costa Rica','HR':'Croatia','CZ':'Czechia',
    'DK':'Denmark','EC':'Ecuador','EG':'Egypt','EE':'Estonia','FI':'Finland',
    'FR':'France','DE':'Germany','GR':'Greece','GT':'Guatemala','HK':'Hong Kong',
    'HU':'Hungary','IN':'India','ID':'Indonesia','IR':'Iran','IQ':'Iraq','IE':'Ireland',
    'IL':'Israel','IT':'Italy','JP':'Japan','JO':'Jordan','KZ':'Kazakhstan','KW':'Kuwait',
    'LV':'Latvia','LB':'Lebanon','LT':'Lithuania','LU':'Luxembourg','MY':'Malaysia',
    'MT':'Malta','MX':'Mexico','MD':'Moldova','MA':'Morocco','NP':'Nepal',
    'NL':'Netherlands','NZ':'New Zealand','MK':'North Macedonia','NO':'Norway',
    'PK':'Pakistan','PA':'Panama','PY':'Paraguay','PE':'Peru','PH':'Philippines',
    'PL':'Poland','PT':'Portugal','PR':'Puerto Rico','RO':'Romania','RU':'Russia',
    'SA':'Saudi Arabia','RS':'Serbia','SG':'Singapore','SK':'Slovakia','SI':'Slovenia',
    'ZA':'South Africa','KR':'South Korea','ES':'Spain','SE':'Sweden','CH':'Switzerland',
    'TW':'Taiwan','TH':'Thailand','TN':'Tunisia','TR':'Türkiye','UA':'Ukraine',
    'AE':'United Arab Emirates','GB':'United Kingdom','US':'United States',
    'UY':'Uruguay','UZ':'Uzbekistan','VE':'Venezuela','VN':'Vietnam',
    'HN':'Honduras','MO':'Macao','BH':'Bahrain','BD':'Bangladesh','AM':'Armenia'
};

var FLAG_CDN = 'https://flagcdn.com/w40/';
var recordsPerPage = 50;

var allPlayers = [];
var filteredPlayers = [];
var countryMap = {};
var seasonData = {};
var eloMap = {};
var eloHistory = {};
var currentPage = 1;
var updatingHash = false;

function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function profileUrl(tag) {
    return 'https://brawlace.com/players/%23' + encodeURIComponent(tag.replace(/^#/, ''));
}
function insightsUrl(tag) {
    return 'https://brawlinsights.com/en/player/profile/' + encodeURIComponent(tag.replace(/^#/, ''));
}
function getFlagUrl(cc) { return (cc && cc !== 'XX') ? FLAG_CDN + cc.toLowerCase() + '.png' : ''; }
function countryName(cc) { return (cc && cc !== 'XX' && COUNTRY_NAMES[cc]) ? COUNTRY_NAMES[cc] : ''; }

function papaLoad(fileUrl) {
    return new Promise(function(resolve) {
        Papa.parse(fileUrl, {
            download: true, header: false, skipEmptyLines: true,
            complete: function(res) { resolve(res.data || []); },
            error: function() { resolve(null); }
        });
    });
}

function parseSeasonRow(row) {
    var tag = null, placement = null;
    for (var i = 0; i < row.length; i++) {
        var f = String(row[i] == null ? '' : row[i]).trim();
        if (f === '') continue;
        if (tag === null && f.charAt(0) === '#') { tag = f.toUpperCase(); continue; }
        if (placement === null && /^\d+$/.test(f)) { placement = parseInt(f, 10); continue; }
    }
    if (tag && placement !== null) return { tag: tag, placement: placement };
    return null;
}

function tagPlayedIn(tag, seasonIdx) {
    var list = seasonData[SEASONS[seasonIdx].key] || [];
    for (var i = 0; i < list.length; i++) {
        if (list[i].tag === tag) return true;
    }
    return false;
}

// Dernière saison jouée (-1 si jamais joué)
function lastPlayedIdx(tag) {
    for (var i = LAST_SEASON_IDX; i >= 0; i--) {
        if (tagPlayedIn(tag, i)) return i;
    }
    return -1;
}

// ======================= ELO v4 =======================
function computeElo() {
    var ratings = {};
    var history = {};
    var debutIdx = {};

    SEASONS.forEach(function(season, idx) {
        var players = seasonData[season.key] || [];
        var fieldSize = players.length;
        var present = {};

        var vals = [];
        players.forEach(function(p) {
            present[p.tag] = true;
            vals.push(ratings[p.tag] !== undefined ? ratings[p.tag] : START_RATING);
        });
        vals.sort(function(a, b) { return a - b; });
        var medianR = vals.length ? vals[Math.floor(vals.length / 2)] : START_RATING;

        // ---- JOUEURS PRÉSENTS : gains uniquement ----
        players.forEach(function(p) {
            var tag = p.tag;
            if (ratings[tag] === undefined) {
                ratings[tag] = START_RATING;
                debutIdx[tag] = idx;
            }

            var R = ratings[tag];
            var gain = 0;

            if (fieldSize >= 2) {
                var pct = (p.placement - 1) / fieldSize;
                var P = Math.pow(1 - pct, PLACE_EXP);
                var F = Math.min(1, Math.pow(FIELD_MIN / fieldSize, FIELD_EXP));
                var raw = MAX_GAIN * P * F;
                var momentum = Math.max(0, (ELO_CEILING - R) / (ELO_CEILING - START_RATING));
                gain = Math.round(Math.min(MAX_GAIN, raw * momentum));
                if (gain < 2 && momentum >= FLOOR_MOMENTUM) gain = 2;
            } else {
                gain = 2;
            }

            if (!history[tag]) history[tag] = {};
            history[tag][season.key] = (history[tag][season.key] || 0) + gain;
            ratings[tag] += gain;
        });

        // ---- JOUEURS ABSENTS : bouclier 12 mois glissants ----
        for (var tag in ratings) {
            if (present[tag]) continue;
            if (debutIdx[tag] === undefined || debutIdx[tag] >= idx) continue;

            var misses = 0;
            var from = Math.max(0, idx - (SHIELD_WINDOW - 1));
            for (var w = from; w <= idx; w++) {
                if (w < debutIdx[tag]) continue;
                if (!tagPlayedIn(tag, w)) misses++;
            }

            var delta = 0;
            if (misses >= 2) {
                var above = Math.max(0, ratings[tag] - medianR);
                var loss = LOSS_BASE + Math.round(above * LOSS_SCALE);
                delta = -Math.min(MAX_GAIN, loss);
            }

            if (!history[tag]) history[tag] = {};
            history[tag][season.key] = (history[tag][season.key] || 0) + delta;
            ratings[tag] += delta;
        }
    });

    eloHistory = history;
    return ratings;
}

(function initMonths() {
    var sel = document.getElementById('filterMonth');
    SEASONS.forEach(function(s, i) {
        var o = document.createElement('option');
        o.value = i; o.textContent = s.label;
        sel.appendChild(o);
    });
})();

Promise.all([
    papaLoad('countries.csv'),
    papaLoad('leaderboard.csv')
].concat(SEASONS.map(function(s) { return papaLoad('seasons/' + s.key + '.csv'); }))
).then(function(all) {
    (all[0] || []).forEach(function(r) {
        if (r && r.length >= 2 && String(r[0]).indexOf('#') !== -1 &&
            /^[A-Z]{2}$/.test(String(r[1] || '').trim().toUpperCase())) {
            countryMap[String(r[0]).trim().toUpperCase()] = String(r[1]).trim().toUpperCase();
        }
    });

    var si = 2;
    var manquantes = [];
    SEASONS.forEach(function(s) {
        var list = [];
        var raw = all[si++];
        if (raw) {
            raw.forEach(function(row) {
                var p = parseSeasonRow(row);
                if (p) list.push(p);
            });
        } else {
            manquantes.push('seasons/' + s.key + '.csv');
        }
        seasonData[s.key] = list;
    });

    if (manquantes.length) {
        var st = document.getElementById('seasonStatus');
        st.classList.remove('hidden');
        st.textContent = '⚠ Fichiers de saison introuvables : ' + manquantes.join(', ');
    }

    (all[1] || []).forEach(function(row) {
        if (!row || !row[0]) return;
        var tag = String(row[0]).trim().toUpperCase();
        if (tag.indexOf('#') === -1) return;
        var months = [];
        for (var m = 0; m < 18; m++) months.push(parseInt(row[4 + m], 10) || 0);
        allPlayers.push({
            tag: tag,
            pseudo: row[1] ? String(row[1]).trim() : 'Unknown',
            points: parseInt(row[2], 10) || 0,
            peakRank: parseInt(row[3], 10) || 999,
            months: months,
            country: countryMap[tag] || 'XX'
        });
    });

    eloMap = computeElo();
    allPlayers.forEach(function(p) {
        p.elo = eloMap[p.tag] || 0;
        p.lastIdx = lastPlayedIdx(p.tag);                          // -1..17
        p.monthsIdle = p.lastIdx < 0 ? 99 : LAST_SEASON_IDX - p.lastIdx; // saisons depuis dernier match
        p.offline = p.monthsIdle > OFFLINE_MONTHS;                 // offline si > 12 mois
    });

    buildCountryFilter();
    applyFromHash(true);
    document.getElementById('playerCount').innerText = allPlayers.length + ' Records';
});

function buildCountryFilter() {
    var seen = {};
    allPlayers.forEach(function(p) { if (p.country !== 'XX') seen[p.country] = true; });
    var sel = document.getElementById('filterCountry');
    Object.keys(seen).sort(function(a, b) {
        return (COUNTRY_NAMES[a] || a).localeCompare(COUNTRY_NAMES[b] || b);
    }).forEach(function(cc) {
        var o = document.createElement('option');
        o.value = cc; o.textContent = countryName(cc) || cc;
        sel.appendChild(o);
    });
    var o2 = document.createElement('option');
    o2.value = 'XX'; o2.textContent = 'Unknown (?)';
    sel.appendChild(o2);
}

function writeHash() {
    var sort = document.getElementById('filterSort').value;
    var cc = document.getElementById('filterCountry').value || 'all';
    var mi = parseInt(document.getElementById('filterMonth').value, 10);
    var h = '#/' + sort + '/' + cc + '/' + mi;
    if (location.hash !== h) {
        updatingHash = true;
        location.hash = h;
    }
}

function applyFromHash(initial) {
    var seg = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    var sort = seg[0] || 'points';
    var cc = seg[1] && seg[1] !== 'all' ? seg[1].toUpperCase() : '';
    var mi = seg[2] !== undefined && seg[2] !== '' ? parseInt(seg[2], 10) : -1;

    if (['points','elo','peak','activity'].indexOf(sort) === -1) sort = 'points';
    if (isNaN(mi) || mi < -1 || mi > 17) mi = -1;

    document.getElementById('filterSort').value = sort;
    document.getElementById('filterCountry').value = cc;
    document.getElementById('filterMonth').value = String(mi);
    applyFilters(true);
}

window.addEventListener('hashchange', function() {
    if (updatingHash) { updatingHash = false; return; }
    applyFromHash();
});

function applyFilters(skipHash) {
    var q = document.getElementById('searchBar').value.trim().toLowerCase();
    var cc = document.getElementById('filterCountry').value;
    var mi = parseInt(document.getElementById('filterMonth').value, 10);
    var sortMode = document.getElementById('filterSort').value;

    filteredPlayers = allPlayers.filter(function(p) {
        if (cc && p.country !== cc) return false;
        if (mi >= 0) {
            var s = SEASONS[mi];
            var found = null;
            var lst = seasonData[s.key] || [];
            for (var i = 0; i < lst.length; i++) {
                if (lst[i].tag === p.tag) { found = lst[i]; break; }
            }
            if (!found) return false;
            p._monthPlace = found.placement;
        }
        if (q && p.pseudo.toLowerCase().indexOf(q) === -1 && p.tag.toLowerCase().indexOf(q) === -1) return false;
        return true;
    });

    if (mi >= 0) {
        filteredPlayers.sort(function(a, b) { return a._monthPlace - b._monthPlace; });
    } else if (sortMode === 'elo') {
        // Actifs d'abord, puis par Elo ; les offline restent visibles mais en bas
        filteredPlayers.sort(function(a, b) {
            if (!!a.offline !== !!b.offline) return a.offline ? 1 : -1;
            return b.elo - a.elo || b.points - a.points;
        });
    } else if (sortMode === 'peak') {
        filteredPlayers.sort(function(a, b) { return a.peakRank - b.peakRank || b.points - a.points; });
    } else if (sortMode === 'activity') {
        // Le plus actif (a joué le plus récemment) en premier
        filteredPlayers.sort(function(a, b) { return b.lastIdx - a.lastIdx || b.points - a.points; });
    } else {
        filteredPlayers.sort(function(a, b) { return b.points - a.points || a.peakRank - b.peakRank; });
    }
    document.getElementById('filterSort').disabled = (mi >= 0);

    document.getElementById('viewTitle').textContent =
        'Standings — ' + (mi >= 0 ? SEASONS[mi].label : 'All-time') +
        (cc ? ' (' + (countryName(cc) || cc) + ')' : '');
    document.getElementById('statHeader').textContent =
        mi >= 0 ? 'Placement' : (sortMode === 'elo' ? 'Elo' : 'Points');

    currentPage = 1;
    updatePageData();
    if (!skipHash) writeHash();
}

function displayPage(pageData, startIndex, mi, sortMode) {
    var container = document.getElementById('leaderboard');
    container.innerHTML = '';
    if (!pageData.length) {
        container.innerHTML = '<div class="px-4 py-8 text-center text-xs font-mono uppercase text-slate-600">No records found</div>';
        return;
    }
    pageData.forEach(function(player, index) {
        var gi = startIndex + index;
        var rankClass = gi === 0 ? 'rank-1' : gi === 1 ? 'rank-2' : gi === 2 ? 'rank-3' : '';
        var peakLabel = player.peakRank >= 999 ? '-' : 'Top ' + player.peakRank;

        var stat;
        if (mi >= 0) {
            stat = '#<span class="font-black text-emerald-400 font-mono">' + player._monthPlace + '</span>';
        } else if (sortMode === 'elo') {
            if (player.offline) {
                stat = '<span class="text-[10px] uppercase tracking-wider font-bold text-slate-600 font-mono">Offline</span>';
            } else {
                stat = '<span class="font-black text-blue-400 font-mono text-sm">' + Math.round(player.elo) + '</span>';
            }
        } else {
            stat = '<span class="font-black text-emerald-400 font-mono text-sm">' + player.points + '</span>' +
                   '<span class="text-[8px] text-slate-500 ml-1">PTS</span>';
        }

        var flagUrl = getFlagUrl(player.country);
        var flagHtml = flagUrl
            ? '<img src="' + flagUrl + '" class="flag-icon" alt="' + (countryName(player.country) || player.country) + '" title="' + (countryName(player.country) || player.country) + '" loading="lazy">'
            : '<span class="flag-icon bg-[#1e293b] inline-flex items-center justify-center text-[9px] text-slate-600">?</span>';

        var nameCell = '<div class="col-span-4 min-w-0 ' + (player.offline ? 'opacity-40' : '') + '">' +
            '<div class="font-bold text-white text-sm truncate" title="' + escapeHtml(player.pseudo) + '">' + escapeHtml(player.pseudo) + '</div>' +
            '<div class="text-[10px] text-slate-500 font-mono truncate">' + escapeHtml(player.tag) + '</div></div>';

        var row = document.createElement('div');
        row.className = 'player-row grid grid-cols-12 gap-3 px-4 py-3 items-center cursor-pointer';
        row.onclick = function() { openDrawer(player); };
        row.innerHTML =
            '<div class="rank-badge ' + rankClass + '">' + (gi + 1) + '</div>' +
            '<div class="flex items-center">' + flagHtml + '</div>' +
            nameCell +
            '<div class="col-span-2 text-right text-xs font-bold text-amber-500/90 font-mono whitespace-nowrap">' + peakLabel + '</div>' +
            '<div class="col-span-4 text-right whitespace-nowrap">' + stat + '</div>';
        container.appendChild(row);
    });
}

function openDrawer(p) {
    var flagUrl = getFlagUrl(p.country);
    var dFlag = document.getElementById('dFlag');
    if (flagUrl) { dFlag.src = flagUrl; dFlag.style.display = ''; } else { dFlag.style.display = 'none'; }
    document.getElementById('dName').textContent = p.pseudo;
    document.getElementById('dTag').textContent = p.tag;
    document.getElementById('dCountry').textContent = countryName(p.country) || 'Country unknown';
    document.getElementById('dPoints').textContent = p.points;
    document.getElementById('dElo').textContent = p.offline ? 'Offline' : (p.elo ? Math.round(p.elo) : '-');
    document.getElementById('dPeak').textContent = p.peakRank >= 999 ? 'N/A' : 'Top ' + p.peakRank;
    document.getElementById('dLink').href = profileUrl(p.tag);
    document.getElementById('dLinkBI').href = insightsUrl(p.tag);

    var dStatus = document.getElementById('dStatus');
    if (p.offline) {
        dStatus.classList.remove('hidden');
        dStatus.className = 'text-[9px] uppercase tracking-widest font-black px-2 py-0.5 rounded bg-slate-800 text-slate-500';
        dStatus.textContent = 'Offline · Last played ' + (p.lastIdx >= 0 ? SEASONS[p.lastIdx].label : 'never');
    } else {
        dStatus.classList.remove('hidden');
        dStatus.className = 'text-[9px] uppercase tracking-widest font-black px-2 py-0.5 rounded bg-emerald-900/40 text-emerald-500';
        dStatus.textContent = 'Active · Last played ' + (p.lastIdx >= 0 ? SEASONS[p.lastIdx].label : 'never');
    }

    var hist = '';
    var h = eloHistory[p.tag] || {};
    for (var m = 0; m < 18; m++) {
        var s = SEASONS[m];
        var lst = seasonData[s.key] || [];
        var found = null;
        for (var i = 0; i < lst.length; i++) {
            if (lst[i].tag === p.tag) { found = lst[i]; break; }
        }
        var delta = h[s.key];
        if (found || delta !== undefined) {
            var placeStr = found ? '<span class="text-amber-500">#' + found.placement + '</span>' : '<span class="text-slate-600">inactive</span>';
            var eloStr = '';
            if (delta !== undefined) {
                var arr = Math.round(delta);
                eloStr = arr > 0
                    ? '<span class="elo-plus">+' + arr + '</span>'
                    : arr < 0 ? '<span class="elo-minus">' + arr + '</span>' : '';
            }
            hist += '<div class="flex justify-between bg-[#090f1c] border border-slate-800 rounded px-3 py-1.5">' +
                    '<span class="text-slate-400">' + s.label + '</span>' +
                    '<span>' + placeStr + ' ' + eloStr + '</span></div>';
        }
    }
    document.getElementById('dHistory').innerHTML = hist || '<div class="text-slate-600 text-xs">No ranked seasons recorded.</div>';
    document.getElementById('playerDrawer').classList.add('open');
    document.body.classList.add('drawer-open');
}

function closeDrawer() {
    document.getElementById('playerDrawer').classList.remove('open');
    document.body.classList.remove('drawer-open');
}

function updatePageData() {
    var mi = parseInt(document.getElementById('filterMonth').value, 10);
    var sortMode = document.getElementById('filterSort').value;
    var totalPages = Math.ceil(filteredPlayers.length / recordsPerPage) || 1;
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;
    var start = (currentPage - 1) * recordsPerPage;
    displayPage(filteredPlayers.slice(start, start + recordsPerPage), start, mi, sortMode);
    document.getElementById('pageIndicator').innerText = 'Page ' + currentPage + '/' + totalPages;
    document.getElementById('btnPrev').disabled = (currentPage === 1);
    document.getElementById('btnNext').disabled = (currentPage === totalPages);
}

function changePage(dir) { currentPage += dir; updatePageData(); }

document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeDrawer(); });
</script>
